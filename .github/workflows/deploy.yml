name: Deploy Backend to EC2

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and validate
        run: |
          npm ci
          npx prisma generate
          npm test
          npm run build
          npx prisma validate
        env:
          DATABASE_URL: mysql://user:password@localhost:3306/scaniro_ci
          JWT_ACCESS_SECRET: test-access-secret-that-is-at-least-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-that-is-at-least-32-chars
          OTP_HASH_SECRET: test-otp-hash-secret-that-is-at-least-32-chars
          AWS_ACCESS_KEY_ID: test-access-key
          AWS_SECRET_ACCESS_KEY: test-secret-key
          AWS_S3_BUCKET: scanpro-test-bucket
          SMTP_HOST: smtp.example.com
          SMTP_PORT: '587'
          SMTP_USER: test-smtp-user@example.com
          SMTP_PASSWORD: test-smtp-password
          SMTP_FROM: test-smtp-user@example.com

      - name: Prepare optional deployment env overrides
        id: env_overrides
        env:
          OTP_HASH_SECRET: ${{ secrets.OTP_HASH_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          node -e '
            const fs = require("node:fs");
            const keys = [
              "OTP_HASH_SECRET",
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USER",
              "SMTP_PASSWORD",
              "SMTP_FROM",
            ];
            const payload = {};
            for (const key of keys) {
              const value = process.env[key];
              if (typeof value === "string" && value.trim() !== "") {
                payload[key] = value;
              }
            }
            const b64 = Object.keys(payload).length > 0
              ? Buffer.from(JSON.stringify(payload), "utf8").toString("base64")
              : "";
            if (b64) {
              console.log(`::add-mask::${b64}`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `b64=${b64}\n`);
          '

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_ENV_OVERRIDES_B64: ${{ steps.env_overrides.outputs.b64 }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: DEPLOY_ENV_OVERRIDES_B64
          script_stop: true
          script: |
            set -e

            echo "📂 Navigating to project directory..."
            cd /srv/scaniro/backend

            echo "📥 Fetching and syncing to production branch..."
            git fetch origin production
            git reset --hard origin/production

            echo "🔐 Ensuring production .env is loaded..."
            if [ -n "${DEPLOY_ENV_OVERRIDES_B64:-}" ] && [ -f /srv/scaniro/.env ]; then
              node -e '
                const fs = require("node:fs");
                const envPath = "/srv/scaniro/.env";
                const overrides = JSON.parse(
                  Buffer.from(process.env.DEPLOY_ENV_OVERRIDES_B64, "base64").toString("utf8")
                );
                const lines = fs.readFileSync(envPath, "utf8").split(/\r?\n/);
                const updated = lines.map((line) => {
                  const m = line.match(/^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=/);
                  if (m && Object.prototype.hasOwnProperty.call(overrides, m[1])) {
                    const value = overrides[m[1]];
                    delete overrides[m[1]];
                    const quote = value.includes("\x27") ? JSON.stringify(value) : `\x27${value}\x27`;
                    return `${m[1]}=${quote}`;
                  }
                  return line;
                });
                for (const [k, value] of Object.entries(overrides)) {
                  const quote = value.includes("\x27") ? JSON.stringify(value) : `\x27${value}\x27`;
                  updated.push(`${k}=${quote}`);
                }
                const cleaned = updated.filter((line, idx, arr) => idx < arr.length - 1 || line !== "");
                fs.writeFileSync(envPath, cleaned.join("\n") + "\n", { mode: 0o600 });
              '
            fi
            if [ -f /srv/scaniro/.env ]; then
              cp /srv/scaniro/.env /srv/scaniro/backend/.env
            fi
            node -e '
              const fs = require("node:fs");
              const path = "/srv/scaniro/backend/.env";
              if (!fs.existsSync(path)) {
                console.error("Deployment blocked: /srv/scaniro/.env is missing on EC2.");
                process.exit(1);
              }
              const required = [
                "DATABASE_URL",
                "JWT_ACCESS_SECRET",
                "JWT_REFRESH_SECRET",
                "OTP_HASH_SECRET",
                "AWS_ACCESS_KEY_ID",
                "AWS_SECRET_ACCESS_KEY",
                "SMTP_HOST",
                "SMTP_PORT",
                "SMTP_USER",
                "SMTP_PASSWORD",
                "SMTP_FROM",
              ];
              const present = new Set();
              for (const rawLine of fs.readFileSync(path, "utf8").split(/\r?\n/)) {
                const line = rawLine.trim();
                if (!line || line.startsWith("#")) continue;
                const eq = line.indexOf("=");
                if (eq <= 0) continue;
                const key = line.slice(0, eq).replace(/^export\s+/, "").trim();
                const val = line.slice(eq + 1).trim();
                if (key && val !== "" && val !== "\"\"" && val !== "\x27\x27") {
                  present.add(key);
                }
              }
              const missing = required.filter((k) => !present.has(k));
              if (missing.length > 0) {
                console.error(
                  "Deployment blocked: /srv/scaniro/.env is missing required keys: " +
                  missing.join(", ") +
                  ". Add them to /srv/scaniro/.env on EC2 or configure matching GitHub Actions Secrets."
                );
                process.exit(1);
              }
            '

            echo "📦 Installing dependencies..."
            npm ci

            echo "🔧 Generating Prisma Client..."
            npx prisma generate

            echo "🏗️ Building TypeScript..."
            npm run build

            echo "🗄️ Applying reviewed Prisma migrations..."
            if [ ! -d prisma/migrations ] || ! find prisma/migrations -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .; then
              echo "Deployment blocked: Prisma migrations are missing."
              exit 1
            fi
            if [ ! -f prisma/migrations/20260930150000_initial_schema_baseline/BASELINE_VERIFIED ]; then
              echo "Deployment blocked: production migration baseline requires database verification."
              exit 1
            fi
            node dist/scripts/reconcile-phase1-schema.js
            npx prisma migrate deploy

            echo "🔄 Restarting PM2 process..."
            pm2 restart scaniro-backend --update-env || pm2 start dist/server.js --name scaniro-backend --node-args="--env-file=.env"

            echo "🔐 Hashing legacy refresh sessions..."
            node dist/scripts/hash-refresh-tokens.js

            echo "💾 Saving PM2 process list..."
            pm2 save

            echo "✅ Deployment completed successfully!"