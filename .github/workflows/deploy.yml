name: Deploy Backend to EC2

on:
  push:
    branches:
      - production # Ya master, jo bhi aapki default branch ho

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 1. Project directory me navigate karein
            cd /srv/scaniro/backend

            # 2. Latest code pull karein
            git pull origin main

            # 3. Dependencies install aur build karein
            npm install
            npm run build

            # 4. Prisma database schema sync karein
            npx prisma db push

            # 5. PM2 restart ya start karein
            pm2 restart scanpro-backend || pm2 start dist/app.js --name scanpro-backend

            # 6. PM2 configuration save karein
            pm2 save