name: Deploy Backend to EC2

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test & Build
        run: |
          npm ci
          npx prisma generate
          npm test
          npm run build
          npx prisma validate
        env:
          DATABASE_URL: mysql://user:password@localhost:3306/scaniro_ci
          JWT_ACCESS_SECRET: test-access-secret-that-is-at-least-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-that-is-at-least-32-chars
          OTP_HASH_SECRET: test-otp-hash-secret-that-is-at-least-32-chars
          AWS_ACCESS_KEY_ID: test-access-key
          AWS_SECRET_ACCESS_KEY: test-secret-key
          AWS_S3_BUCKET: scanpro-test-bucket
          SMTP_HOST: smtp.example.com
          SMTP_PORT: '587'
          SMTP_USER: test-smtp-user@example.com
          SMTP_PASSWORD: test-smtp-password
          SMTP_FROM: test-smtp-user@example.com

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e

            cd /srv/scaniro/backend

            echo "📥 Pulling latest production code..."
            git fetch origin production
            git reset --hard origin/production

            echo "🔐 Syncing .env from server config..."
            cp /srv/scaniro/.env /srv/scaniro/backend/.env

            echo "📦 Installing dependencies..."
            npm ci --omit=dev

            echo "🔧 Generating Prisma Client..."
            npx prisma generate

            echo "🏗️ Building TypeScript..."
            npm run build

            echo "🗄️ Running Prisma migrations..."
            npx prisma migrate deploy

            echo "🔄 Restarting application..."
            pm2 restart scaniro-backend --update-env || pm2 start dist/server.js --name scaniro-backend
            pm2 save

            echo "✅ Deployment complete!"
