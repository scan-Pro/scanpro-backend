name: Deploy Backend to EC2

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and validate
        run: |
          npm ci
          npx prisma generate
          npm test
          npm run build
          npx prisma validate
        env:
          DATABASE_URL: mysql://user:password@localhost:3306/scaniro_ci
          JWT_ACCESS_SECRET: test-access-secret-that-is-at-least-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-that-is-at-least-32-chars
          OTP_HASH_SECRET: test-otp-hash-secret-that-is-at-least-32-chars
          AWS_ACCESS_KEY_ID: test-access-key
          AWS_SECRET_ACCESS_KEY: test-secret-key
          AWS_S3_BUCKET: scanpro-test-bucket
          SMTP_HOST: smtp.example.com
          SMTP_PORT: '587'
          SMTP_USER: test-smtp-user@example.com
          SMTP_PASSWORD: test-smtp-password
          SMTP_FROM: test-smtp-user@example.com

      - name: Prepare optional deployment env overrides
        id: env_overrides
        env:
          OTP_HASH_SECRET: ${{ secrets.OTP_HASH_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: node scripts/sync-deploy-env.mjs --prepare

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_ENV_OVERRIDES_B64: ${{ steps.env_overrides.outputs.b64 }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: DEPLOY_ENV_OVERRIDES_B64
          script_stop: true
          script: |
            set -e

            echo "📂 Navigating to project directory..."
            cd /srv/scaniro/backend

            echo "📥 Fetching and syncing to production branch..."
            git fetch origin production
            git reset --hard origin/production

            echo "🔐 Ensuring production .env is loaded..."
            node scripts/sync-deploy-env.mjs

            echo "📦 Installing dependencies..."
            npm ci

            echo "🔧 Generating Prisma Client..."
            npx prisma generate

            echo "🏗️ Building TypeScript..."
            npm run build

            echo "🗄️ Applying reviewed Prisma migrations..."
            if [ ! -d prisma/migrations ] || ! find prisma/migrations -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .; then
              echo "Deployment blocked: Prisma migrations are missing."
              exit 1
            fi
            if [ ! -f prisma/migrations/20260930150000_initial_schema_baseline/BASELINE_VERIFIED ]; then
              echo "Deployment blocked: production migration baseline requires database verification."
              exit 1
            fi
            node dist/scripts/reconcile-phase1-schema.js
            npx prisma migrate deploy

            echo "🔄 Restarting PM2 process..."
            pm2 restart scaniro-backend --update-env || pm2 start dist/server.js --name scaniro-backend --node-args="--env-file=.env"

            echo "🔐 Hashing legacy refresh sessions..."
            node dist/scripts/hash-refresh-tokens.js

            echo "💾 Saving PM2 process list..."
            pm2 save

            echo "✅ Deployment completed successfully!"