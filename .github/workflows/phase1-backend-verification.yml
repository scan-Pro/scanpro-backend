name: Phase 1 Backend Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/scaniro_ci
      - run: npm test
      - run: npm run build
